name: ci

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  semantic_pull_request:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@bca17593224500d894e3fc7df09937ec603e35cd # v1.21.0

  spell-check:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@bca17593224500d894e3fc7df09937ec603e35cd # v1.21.0
    with:
      includes: "**/*.md"
      modified_files_only: false

  dart-package:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: ✨ Check Formatting
        run: |
          dart run melos run format:ci
          dart format tool test/tool --set-exit-if-changed

      - name: 🕵️ Analyze
        run: |
          dart run melos run analyze
          dart analyze .

      - name: 🧪 Run Tests
        run: |
          dart run melos run test:ci
          dart test test/tool/analyzer_plugin_harness_test.dart

      - name: 🧩 Verify Dart Analyzer Plugin Host
        run: dart run tool/verify_analyzer_plugins.dart --plugin all --source local --analyzer dart --repeat 3

  analyzer-plugin-compatibility:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: plugin-host-${{ matrix.os }}-flutter-${{ matrix.flutter-version }}-${{ matrix.analyzer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        flutter-version:
          - 3.44.0
          - 3.47.2
        analyzer:
          - dart
          - flutter

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: ✨ Check Formatting
        run: |
          dart run melos run format:ci
          dart format tool test/tool --set-exit-if-changed

      - name: 🕵️ Analyze
        run: |
          dart run melos run analyze
          dart analyze .

      - name: 🧪 Run Tests
        run: |
          dart run melos run test:ci
          dart test test/tool/analyzer_plugin_harness_test.dart

      - name: 🧩 Verify Analyzer Plugin Host
        run: dart run tool/verify_analyzer_plugins.dart --plugin all --source local --analyzer ${{ matrix.analyzer }} --repeat 3
