# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    # trunk's sandboxed dart subprocess strips PUB_CACHE, so the analyzer
    # plugin falls back to the root-owned default ~/.pub-cache and fails
    # with "Permission denied" setting up hosted-hashes. Use the project's
    # own `dart analyze` / `melos exec` (see CLAUDE.md) instead.
    - dart
    - pinact
  enabled:
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - actionlint@1.7.10
    - checkov@3.3.8
    - git-diff-check
    - markdownlint@0.49.1
    - oxipng@10.1.0
    - prettier@3.9.6
    - svgo@4.0.2
    - trufflehog@3.93.1
    - yamllint@1.38.0
  ignore:
    - paths:
        - .github/ISSUE_TEMPLATE/*.md
        - .github/PULL_REQUEST_TEMPLATE.md
      linters:
        - markdownlint
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
