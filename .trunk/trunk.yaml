# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.23.4
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: cspell
      files: [markdown]
      commands:
        - name: lint
          run: cspell --config cspell.json --no-progress --no-summary --show-suggestions --no-cache ${target}
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
  disabled:
    # trunk's sandboxed dart subprocess strips PUB_CACHE, so the analyzer
    # plugin falls back to the root-owned default ~/.pub-cache and fails
    # with "Permission denied" setting up hosted-hashes. Use the project's
    # own `dart analyze` / `melos exec` (see CLAUDE.md) instead.
    - grype
    - dart
  enabled:
    - actionlint@1.7.12
    - checkov@3.4.0
    - cspell@10.4.0
    - git-diff-check
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - oxipng@10.2.1
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - svgo@4.1.0
    - trufflehog@3.99.7
    - yamllint@1.38.0
  ignore:
    - paths:
        - .github/ISSUE_TEMPLATE/*.md
        - .github/PULL_REQUEST_TEMPLATE.md
      linters:
        - markdownlint
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
