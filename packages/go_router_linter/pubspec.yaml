version: 0.5.0

repository: https://github.com/AndrewDongminYoo/custom_linters

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  analysis_server_plugin: ^0.3.25
  analyzer: ^14.6.0
  pubspec_parse: ^1.7.0

dev_dependencies:
  analyzer_testing: ^0.4.4
  flutter:
    sdk: flutter
  test: ^1.33.0
  test_reflective_loader: ^0.6.0
  very_good_analysis: ^11.0.0
