name: go_router_linter
description: Analyzer diagnostics for consistent route definitions and navigation calls with the go_router package.
version: 0.5.0

repository: https://github.com/AndrewDongminYoo/custom_linters

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  analysis_server_plugin: ">=0.3.22 <0.4.0"
  analyzer: ">=14.3.0 <15.0.0"
  pubspec_parse: ^1.6.0

dev_dependencies:
  analyzer_testing: ^0.4.1
  flutter:
    sdk: flutter
  test: ^1.31.1
  test_reflective_loader: ^0.4.0
  very_good_analysis: ^10.2.0
